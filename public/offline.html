<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Indo-German School</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #f6efe2;
        color: #2b2418;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1812;
          color: #f4ebd9;
        }
      }
      .wrap {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.8;
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #2b2418;
        color: #f6efe2;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #f4ebd9;
          color: #1c1812;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>
        This page needs an internet connection. Check your network and try
        again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
